apiVersion: apps/v1
kind: Deployment
metadata:
  name: krishi-model-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: krishi-model
  template:
    metadata:
      labels:
        app: krishi-model
    spec:
      containers:
        - name: krishi-model
          image: krishi-model:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "8Gi"
              cpu: "2"
            limits:
              memory: "10Gi"
              cpu: "4"
