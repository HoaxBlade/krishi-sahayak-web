version: "3.8"

services:
  krishi-ml-multi:
    build:
      context: .
      dockerfile: Dockerfile.multi
    ports:
      - "5000:5000"
    environment:
      - FLASK_PORT=5000
      - FLASK_HOST=0.0.0.0
      - RATE_LIMIT_REQUESTS=100
      - RATE_LIMIT_WINDOW=3600
      - MAX_FILE_SIZE=10485760
      - MEMORY_HEALTH_THRESHOLD=90
      - CPU_HEALTH_THRESHOLD=95
    volumes:
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 2G
          cpus: "1.0"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
